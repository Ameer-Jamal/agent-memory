name: Bug report
description: Something did not install, preserve, retrieve, or clean up as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please use synthetic examples. Do not paste private notes, credentials, or config backups. Report sensitive vulnerabilities through the Security tab."
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: OS, Node version, Agent Memory version, and relevant coding agent/version.
      placeholder: "macOS, Node 22, Agent Memory 0.1.0, Codex CLI ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal, redacted example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted diagnostics
    validations:
      required: true
