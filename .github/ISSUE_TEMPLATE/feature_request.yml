name: Feature request
description: Suggest an improvement to shared memory, setup, or agent compatibility.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the workflow and current friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Relevant agents or platforms
